name: NimbusFS CI

on:
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # ─── Build & Test ────────────────────────────────────────────────────────────
  build:
    name: Build & Test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest

    strategy:
      matrix:
        java: [ 17, 21 ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK ${{ matrix.java }}
        uses: actions/setup-java@v4
        with:
          java-version: ${{ matrix.java }}
          distribution: temurin
          cache: maven

      - name: Build & run all tests
        run: mvn -B clean verify --no-transfer-progress
        env:
          # headless mode for any JavaFX-adjacent code paths
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-jdk${{ matrix.java }}
          path: "**/target/surefire-reports/*.xml"
          retention-days: 7

      - name: Upload shaded JARs
        if: matrix.java == 17
        uses: actions/upload-artifact@v4
        with:
          name: nimbusfs-jars
          path: |
            nimbusfs-master/target/nimbusfs-master-*-shaded.jar
            nimbusfs-node/target/nimbusfs-node-*-shaded.jar
            nimbusfs-client/target/nimbusfs-client-*-shaded.jar
          retention-days: 30

  # ─── Code Quality ────────────────────────────────────────────────────────────
  quality:
    name: Code Quality
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Check for compiler warnings
        run: mvn -B clean compile -Xlint:all --no-transfer-progress 2>&1 | tee compile-warnings.txt || true

      - name: Upload compile warnings log
        uses: actions/upload-artifact@v4
        with:
          name: compile-warnings
          path: compile-warnings.txt
          retention-days: 7

  # ─── Release (only on version tags) ─────────────────────────────────────────
  release:
    name: Release
    runs-on: ubuntu-latest
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: 17
          distribution: temurin
          cache: maven

      - name: Build release JARs
        run: mvn -B clean package -DskipTests --no-transfer-progress
        env:
          JAVA_TOOL_OPTIONS: "-Djava.awt.headless=true"

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: NimbusFS ${{ steps.version.outputs.VERSION }}
          body: |
            ## NimbusFS ${{ steps.version.outputs.VERSION }}

            ### Artifacts
            | JAR | Description |
            |-----|-------------|
            | `nimbusfs-master-*-shaded.jar` | Master metadata server (includes all dependencies) |
            | `nimbusfs-node-*-shaded.jar`   | Storage node server (includes all dependencies) |
            | `nimbusfs-client-*-shaded.jar` | JavaFX desktop client (includes all dependencies) |

            ### Quick Start
            ```bash
            # 1. Start Master Server
            java -jar nimbusfs-master-${{ steps.version.outputs.VERSION }}-shaded.jar

            # 2. Start Storage Node(s)
            java -jar nimbusfs-node-${{ steps.version.outputs.VERSION }}-shaded.jar

            # 3. Launch Desktop Client
            java -jar nimbusfs-client-${{ steps.version.outputs.VERSION }}-shaded.jar
            ```
          files: |
            nimbusfs-master/target/nimbusfs-master-*-shaded.jar
            nimbusfs-node/target/nimbusfs-node-*-shaded.jar
            nimbusfs-client/target/nimbusfs-client-*-shaded.jar
          draft: false
          prerelease: false
