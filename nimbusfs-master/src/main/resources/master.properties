# NimbusFS Master Server Configuration
# -------------------------------------------
# Server port that clients and nodes connect to
master.port=9000

# Default number of replicas per chunk
master.replication.factor.default=3

# Maximum chunk size: 32 MB
master.chunk.size.bytes=33554432

# SQLite database file path
# Defaults to ~/.nimbusfs/master.db
master.db.path=

# Heartbeat settings (seconds)
master.heartbeat.interval.seconds=5
master.heartbeat.timeout.seconds=15

# Transport-layer security (TLS 1.3)
# Set to true to enable encrypted sockets between clients/nodes and master.
# A self-signed keystore is auto-generated at ~/.nimbusfs/nimbus.jks on first launch.
master.tls.enabled=false
