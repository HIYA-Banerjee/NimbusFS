# NimbusFS Storage Node Configuration
# -------------------------------------------
# Persistent node UUID — generated automatically on first run if not set.
# Set this explicitly to keep the same identity across restarts.
node.id=

# Public hostname or IP that the Master and other nodes can reach this node at
node.host=localhost

# TCP port this node's ChunkServer listens on
node.chunk.port=9001

# Optional display name shown in the UI (e.g. "Node 1")
node.display.name=

# Directory to store chunk data
# Defaults to ~/.nimbusfs/node-<port>/
node.storage.dir=

# Maximum storage capacity (bytes). Default: 10 GB
node.storage.limit.bytes=10737418240

# Master Server connection
master.host=localhost
master.port=9000
